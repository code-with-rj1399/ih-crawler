server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

spring:
  application:
    name: ih-crawler
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # Override with DATABASE_URL (postgres://, postgresql://, or jdbc:postgresql://)
    # or SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interviewhq}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      pool-name: ih-crawler
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 15000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    default-property-inclusion: non_null
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ih-crawler
    description: InterviewHQ polite crawler

# Documented defaults. Live values are read from crawler_config (seeded by Flyway).
crawler:
  user-agent: "InterviewHQBot/1.0 (ih-crawler; +https://interviewhq.ai/bot)"
  lookback-hours: 24
  max-concurrency: 4
  per-host-concurrency: 1
  timeout-ms: 15000
  max-bytes: 1048576
  max-retries: 3
  circuit-failures: 5
  circuit-open-minutes: 30
  robots-cache-hours: 6
  extract-model: grok-4.5
  extract-max-posts-per-job: 12
  extract-max-tokens: 1200
