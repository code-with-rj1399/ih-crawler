server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

spring:
  application:
    name: ih-crawler
  dynamodb:
    table: ${DYNAMODB_TABLE:interviewhq-crawler-dev}
    region: ${AWS_REGION:ap-south-1}
    endpoint: ${DYNAMODB_ENDPOINT:}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    default-property-inclusion: non_null
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ih-crawler
    description: InterviewHQ polite crawler

# Documented defaults. Live values are read from crawler_config (seeded by Flyway).
crawler:
  user-agent: "InterviewHQBot/1.0 (ih-crawler; +https://interviewhq.ai/bot)"
  lookback-hours: 24
  max-concurrency: 4
  per-host-concurrency: 1
  timeout-ms: 15000
  max-bytes: 1048576
  max-retries: 3
  circuit-failures: 5
  circuit-open-minutes: 30
  robots-cache-hours: 6
  extract-model: grok-4.5
  extract-max-posts-per-job: 12
  extract-max-tokens: 1200
