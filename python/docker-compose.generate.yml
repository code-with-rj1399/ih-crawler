services:
  generate-and-ingest:
    build:
      context: ..
      dockerfile: python/Dockerfile.generate
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      HQ_API_URL: ${HQ_API_URL:-http://host.docker.internal:8080/api/v1/interview-experiences}
    volumes:
      - ${INPUT_DIR:-./data}:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
