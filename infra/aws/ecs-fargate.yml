AWSTemplateFormatVersion: '2010-09-09'
Description: InterviewHQ crawler on ECS Fargate

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with outbound NAT access
  ContainerImage:
    Type: String
    Description: Full ECR image URI including tag
  OpenAiSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the OpenAI API key
  DynamoDbTableName:
    Type: String
    Default: interviewhq-crawler-prod
  Cpu:
    Type: String
    Default: '2048'
  Memory:
    Type: String
    Default: '4096'
  CrawlerCron:
    Type: String
    Default: '0 0 * * * *'
  CrawlerLookbackHours:
    Type: String
    Default: '48'

Resources:
  DynamoDbTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DynamoDbTableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: interviewhq-crawler-prod
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ecs/interviewhq-crawler
      RetentionInDays: 30

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: InterviewHQ crawler outbound-only security group
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: interviewhq-crawler-prod

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: interviewhq-crawler-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadOpenAiSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref OpenAiSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: interviewhq-crawler-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDbAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                Resource: !GetAtt DynamoDbTable.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: interviewhq-crawler
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: crawler
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8090
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: prod
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DYNAMODB_TABLE
              Value: !Ref DynamoDbTableName
            - Name: DYNAMODB_AUTO_CREATE_TABLE
              Value: 'false'
            - Name: CRAWLER_CRON
              Value: !Ref CrawlerCron
            - Name: CRAWLER_LOOKBACK_HOURS
              Value: !Ref CrawlerLookbackHours
            - Name: CRAWLER_BROWSER_HEADLESS
              Value: 'true'
          Secrets:
            - Name: OPENAI_API_KEY
              ValueFrom: !Ref OpenAiSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: crawler
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -fsS http://127.0.0.1:8090/actuator/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 90

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - TaskDefinition
    Properties:
      ServiceName: interviewhq-crawler
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: false
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets: !Ref PrivateSubnetIds

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceArn:
    Value: !Ref Service
  LogGroupName:
    Value: !Ref LogGroup
  SecurityGroupId:
    Value: !Ref SecurityGroup
